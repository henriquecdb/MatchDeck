<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatchDeck</title>
    <style>
      body{margin:0;background:#10151e;color:#e9edf2;font-family:system-ui,sans-serif}
      .boot-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
      .boot-mark{width:52px;height:52px;display:grid;place-items:center;border:1px solid #50c9e9;border-radius:14px;color:#50c9e9;font-size:28px;font-weight:800;margin-bottom:18px}
      .boot-title{font-size:20px;letter-spacing:3px}.boot-title span{color:#50c9e9}.boot-screen p{color:#9aa9be;font-size:13px}.boot-screen progress{width:160px;height:4px;accent-color:#50c9e9;margin-top:12px}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-screen"><div class="boot-mark" aria-hidden="true">M</div><strong class="boot-title">MATCH<span>DECK</span></strong><p role="status">Carregando MatchDeck…</p><progress aria-label="Carregando aplicativo"></progress></div></div>
    <script>
      try {
        if (localStorage.getItem('matchdeck.interfaceLanguage') === 'en') {
          document.documentElement.lang = 'en';
          document.querySelector('[role="status"]').textContent = 'Loading MatchDeck…';
          document.querySelector('progress').setAttribute('aria-label', 'Loading application');
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
