name: Windows security candidate
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Candidate build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-cargo
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build unsigned candidate without publishing
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 candidate-tauri.json
          npm run desktop:build -- --ci --config candidate-tauri.json -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-security-candidate
          path: |
            src-tauri/target/release/matchdeck.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
  scan:
    needs: build
    uses: ./.github/workflows/binary-scan.yml
    with:
      artifact: windows-security-candidate
