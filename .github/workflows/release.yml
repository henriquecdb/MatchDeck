name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  dependencies:
    uses: ./.github/workflows/security.yml
  release:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.notes.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: windows-cargo
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Prepare release notes
        id: notes
        run: node scripts/release-notes.mjs
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ steps.notes.outputs.tag }}
          releaseName: MatchDeck ${{ steps.notes.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --ci -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-package
          path: |
            src-tauri/target/release/matchdeck.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
  scan:
    needs: release
    uses: ./.github/workflows/binary-scan.yml
    with:
      artifact: windows-release-package
  publish:
    needs: [release, scan, dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified release
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
